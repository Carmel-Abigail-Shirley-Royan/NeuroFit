<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detection Results</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            margin: 0;
            font-family: 'Poppins', sans-serif;
            padding: 20px;
        }
        .result-container {
            background: white;
            padding: 30px 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            width: 90%;
            max-width: 400px;
        }
        .result-icon {
            font-size: 4rem;
            margin-bottom: 20px;
        }
        .result-title {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 10px;
        }
        .result-message {
            font-size: 1.1rem;
            color: #555;
            margin-bottom: 30px;
        }
        .btn-action {
            width: 100%;
            padding: 15px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 12px;
            border: none;
            transition: all 0.3s ease;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none; /* For links styled as buttons */
        }
        .btn-danger-style {
             background: linear-gradient(135deg, #ff416c, #ff4b2b);
             color: white;
             box-shadow: 0 5px 15px rgba(255, 65, 108, 0.4);
        }
         .btn-danger-style:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(255, 65, 108, 0.6);
            background: linear-gradient(135deg, #f7305b, #e63a1a);
            color: white; /* Ensure text color remains on hover */
        }
        .btn-safe-style {
             background: linear-gradient(135deg, #43e97b, #38f9d7);
             color: #1a3c34;
             box-shadow: 0 5px 15px rgba(67, 233, 123, 0.4);
        }
        .btn-safe-style:hover {
             transform: translateY(-3px);
             box-shadow: 0 8px 20px rgba(67, 233, 123, 0.6);
             background: linear-gradient(135deg, #3bd970, #2ce9c8);
             color: #1a3c34; /* Ensure text color remains on hover */
        }

        .icon-seizure { color: #dc3545; }
        .icon-safe { color: #198754; }
        .title-seizure { color: #dc3545; }
        .title-safe { color: #198754; }

    </style>
</head>
<body>
    <div class="result-container">
        <div id="resultIcon" class="result-icon">
            </div>
        <h2 id="resultTitle" class="result-title">
            </h2>
        <p id="resultMessage" class="result-message">
            </p>
        <a id="actionButton" href="#" class="btn-action">
             </a>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const prediction = localStorage.getItem("seizurePrediction");
            //localStorage.removeItem("seizurePrediction"); // Optional: clear after reading

            const iconEl = document.getElementById("resultIcon");
            const titleEl = document.getElementById("resultTitle");
            const messageEl = document.getElementById("resultMessage");
            const buttonEl = document.getElementById("actionButton");

            if (prediction === "Seizure Detected") {
                iconEl.innerHTML = '<i class="fas fa-exclamation-triangle icon-seizure"></i>';
                titleEl.textContent = "Seizure Detected";
                titleEl.classList.add("title-seizure");
                messageEl.textContent = "An anomaly consistent with a seizure has been detected in the provided EMG data.";
                buttonEl.textContent = "View First Aid Steps";
                buttonEl.href = "first aid.html"; // Link to your first aid page
                buttonEl.classList.add("btn-danger-style"); // Style for seizure alert

                // Optionally trigger emergency functions directly from here if needed
                // handleEmergency(); // You'd need to copy the handleEmergency function from pop.html if used here
            } else if (prediction === "Safe") { // Assuming "Normal" is the other prediction
                 iconEl.innerHTML = '<i class="fas fa-check-circle icon-safe"></i>';
                 titleEl.textContent = "Normal";
                 titleEl.classList.add("title-safe");
                 messageEl.textContent = "No seizure activity detected in the provided EMG data. You appear to be safe.";
                 buttonEl.textContent = "Back to Home";
                 buttonEl.href = "menu.html"; // Link back to the main menu or home
                 buttonEl.classList.add("btn-safe-style"); // Style for safe result
            }
             else {
                 // Handle unexpected prediction values
                iconEl.innerHTML = '<i class="fas fa-question-circle"></i>';
                titleEl.textContent = "Result Unknown";
                messageEl.textContent = "Could not determine the result from the analysis.";
                buttonEl.textContent = "Back to Home";
                buttonEl.href = "home.html";
                buttonEl.classList.add("btn-secondary"); // Default style
             }
        });

        // If you want the email/call functionality on this page, copy the
        // handleEmergency function and related logic (geolocation, fetch)
        // from pop.html here and call it when appropriate (e.g., automatically
        // if seizure is detected, or via another button).

    </script>
</body>
</html>
